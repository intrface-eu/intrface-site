<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <!-- Placeholder plate for the portrait of Alex Bašić. It is the site's own
       screen and nothing else: warm paper, the near screen at 15 degrees and
       the far screen at -8, and a heavier screen ramped in from the top so the
       plate carries weight at its foot. Swap this file for the photograph;
       keep the 4:5 box so the layout does not move. -->
  <defs>
    <pattern id="far" width="27" height="27" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <circle cx="13.5" cy="13.5" r="2.8" fill="#0f1729" fill-opacity="0.09"/>
    </pattern>
    <pattern id="near" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="4.5" cy="4.5" r="1.25" fill="#0f1729" fill-opacity="0.18"/>
    </pattern>
    <pattern id="heavy" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="9" cy="9" r="6.4" fill="#0f1729" fill-opacity="0.5"/>
    </pattern>
    <linearGradient id="ramp" x1="0.18" y1="0" x2="0.42" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="rampMask">
      <rect width="800" height="1000" fill="url(#ramp)"/>
    </mask>
  </defs>
  <rect width="800" height="1000" fill="#f5f1eb"/>
  <rect width="800" height="1000" fill="url(#far)"/>
  <rect width="800" height="1000" fill="url(#near)"/>
  <rect width="800" height="1000" fill="url(#heavy)" mask="url(#rampMask)"/>
  <!-- Crop ticks: where a plate waits for its image. -->
  <g fill="none" stroke="#0f1729" stroke-opacity="0.3" stroke-width="2">
    <path d="M28 76V28h48"/>
    <path d="M724 28h48v48"/>
    <path d="M772 924v48h-48"/>
    <path d="M76 972H28v-48"/>
  </g>
</svg>
